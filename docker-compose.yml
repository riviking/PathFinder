services:
  mongo:                                   # user-service database (user_db)
    image: mongo:7
    container_name: pathfinder-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - ./seed:/seed:ro
  postgres:                                # notice-service database (notice_db). On the hosted system this is Supabase.
    image: postgres:16
    container_name: pathfinder-postgres
    environment:
      POSTGRES_USER: pathfinder
      POSTGRES_PASSWORD: pathfinder        # development only
      POSTGRES_DB: notice_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./seed:/seed:ro
  mailhog:                                 # a fake mail server: every email can be read at http://localhost:8025
    image: mailhog/mailhog
    container_name: pathfinder-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
  user-service:                            # PathFinder user-service (port 8081)
    build: ./services/user-service
    container_name: pathfinder-user-service
    depends_on:
      - mongo
      - mailhog
    ports:
      - "8081:8081"
    environment:
      SPRING_MONGODB_URI: mongodb://mongo:27017/user_db
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/user_db
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"
      APP_JWT_SECRET: dev-only-secret-please-change-dev-only-secret
      APP_INTERNAL_KEY: dev-internal-key-change-me
volumes:
  mongodata:
  pgdata:
